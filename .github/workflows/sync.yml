name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00) 自动同步
  workflow_dispatch:      # 支持在 Actions 页面手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync Fork from Upstream
        run: |
          gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
